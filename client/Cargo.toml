[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
config.workspace = true
reqwest.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util = "0.7.18"
uuid.workspace = true
common = { path = "../common" }
url.workspace = true
rsa.workspace = true
postcard.workspace = true
anyhow = "1.0.102"
base64.workspace = true
sha2.workspace = true
zip = { version = "8.5.1", features = ["chrono"] }
