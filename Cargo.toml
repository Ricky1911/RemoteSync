[workspace]
resolver = "3"
members = ["client", "common", "server"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.21"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }
serde_json = "1.0.149"
url = { version = "2.5.8", features = ["serde"] }
tempfile = "3.27.0"
sha2 = "0.10.9"
rsa = { version = "0.9.10", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
reqwest = { version = "0.13.2", features = ["json", "multipart", "stream"] }
chrono = { version = "0.4.44", features = ["serde"] }
base64 = "0.22.1"
fake = "5.1.0"

[workspace.package]
authors = ["Ricky1911"]
